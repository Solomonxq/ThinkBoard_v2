[project]
name = "thinkboard-v2"
version = "0.1.0"
description = "ThinkBoard - ideas together"
readme = "README.md,README_UA.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "authlib>=1.6.11",
    "celery>=5.6.3",
    "fastapi[standard]>=0.135.3",
    "httpx>=0.28.1",
    "locust>=2.43.4",
    "passlib>=1.7.4",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.12.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.26",
    "redis>=7.4.0",
    "ruff>=0.15.11",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]

[tool.setuptools.packages.find]
exclude = ["migrations*"]




[dependency-groups]
dev = [
    "ruff>=0.15.6",
]

[tool.ruff]
src = ["app"]
line-length = 88

target-version = "py311"

[tool.ruff.lint]

select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "migrations",
    "tests",
]
